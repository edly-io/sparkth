# Reverse proxy in front of the Sparkth app container (frontend + API + MCP).
# HTTP only for now. Once a domain and certificate exist, follow the steps in
# ../sparkth-ssl.conf.example.

upstream sparkth_app {
    server sparkth:7727;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Chat attachments and Drive uploads are capped at 30 MB by the app.
    client_max_body_size 50m;

    # Let's Encrypt HTTP-01 challenges (used when a certificate is issued).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://sparkth_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Streamed LLM responses and the MCP endpoint must not be buffered.
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_read_timeout      600s;
        proxy_send_timeout      600s;
    }
}
