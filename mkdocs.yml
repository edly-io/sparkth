site_name: Sparkth
site_description: AI-first, open-source learning platform — user guide and developer documentation
repo_url: https://github.com/edly-io/sparkth
docs_dir: docs
# Output goes to site/ (git-ignored). Built locally with `make docs`; published to GitHub Pages by
# .github/workflows/docs.yml on pushes to main that touch its `paths` (docs, this file, deps).

theme:
  name: material
  favicon: img/favicon.ico
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_if_no_docstring: false
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - User guide:
      - Getting started: user-guide/index.md
      - Signing up and signing in: user-guide/account.md
      - My Plugins: user-guide/plugins.md
      - AI keys: user-guide/ai-keys.md
      - Create a course: user-guide/create-course.md
      - Resources: user-guide/resources.md
      - Publish to your LMS: user-guide/publish-to-lms.md
      - Activities and team chat: user-guide/other-plugins.md
      - Analytics: user-guide/analytics.md
      - For administrators: user-guide/admin.md
  - Developer docs:
      - Guides:
          - Configuration: guides/configuration.md
          - User management: guides/user-management.md
          - Backend plugin development: guides/plugins.md
          - Frontend plugin development: guides/frontend-plugins.md
          - Chat document retrieval: guides/chat-retrieval.md
          - Analytics events: guides/analytics-events.md
          - Audit events: guides/audit-events.md
          - Permissions: guides/permissions.md
          - Translations: guides/translations.md
      - Reference:
          - Configuration: reference/configuration.md
          - Python API:
              - Public library (sparkth.lib): reference/lib.md
              - Plugin authoring: reference/plugins.md
              - Permissions: reference/permissions.md
