# pybabel extraction mapping shared by the core and per-plugin extractions
# (see `make i18n.extract`). Paths are relative to the input directory the CLI
# is pointed at: sparkth/ for the core catalog, sparkth/plugins/<name>/ for a
# plugin catalog. The core extraction skips plugins entirely: a plugin owns the
# catalogs under its own locale/ directory so its translations travel with it.
# Migrations and test suites never carry user-facing strings.
[ignore: plugins/**]
[ignore: migrations/**]
[ignore: **/tests/**]
[python: **.py]
